<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tyrone - Assistant IA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- ============================= -->
        <!--            HEADER             -->
        <!-- ============================= -->

        <header>

            <h1>🤖 Tyrone</h1>

            <p>
                Ton assistant personnel
            </p>

        </header>


        <!-- ============================= -->
        <!--       ZONE PRINCIPALE         -->
        <!-- ============================= -->

        <main>

            <!-- Zone de conversation -->

            <section id="conversation">

                <!-- Message de Tyrone -->

                <div class="message tyrone">

                    <strong>Tyrone :</strong>

                    <p>
                        Salut 👋
                        Je suis Tyrone, ton assistant personnel.
                        Comment puis-je t'aider ?
                    </p>

                </div>

            </section>


            <!-- ============================= -->
            <!--       ZONE DE MESSAGE         -->
            <!-- ============================= -->

            <section id="zone-message">

                <input
                    type="text"
                    id="message"
                    placeholder="Écris quelque chose à Tyrone..."
                >

                <button id="micro">
                    🎤
                </button>

                <button id="envoyer">
                    ➤
                </button>

            </section>

        </main>

    </div>
<script src="script.js"></script>
</body>
</html>
